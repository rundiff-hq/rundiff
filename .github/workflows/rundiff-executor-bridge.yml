name: RunDiff Executor Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rundiff-executor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rundiff_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rundiff_bridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_bridge
      SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_bridge_queue
      RUNDIFF_LOCAL_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432
      RUNDIFF_CONTROL_PLANE_URL: https://rundiff.com
      RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN: ${{ secrets.RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN }}
      RUNDIFF_EXECUTOR_SUPERVISOR: go
      RUNDIFF_GO_EXECUTOR_BIN: /tmp/rundiff-executor
      RUNDIFF_DEPENDENCY_CACHE_ROOT: ${{ runner.temp }}/rundiff-dependency-cache
      RUNDIFF_DEPENDENCY_CACHE_NAMESPACE: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Restore RunDiff dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rundiff-dependency-cache
          key: rundiff-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            rundiff-deps-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Go executor supervisor
        working-directory: apps/executor-go
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/rundiff-executor ./cmd/rundiff-executor

      - name: Verify bridge secret
        run: |
          if [[ -z "$RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN" ]]; then
            echo "::error::RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN is not configured"
            exit 1
          fi

      - name: Prepare RunDiff database
        run: bin/rails db:prepare

      - name: Claim and execute RunDiff request
        run: apps/control-plane-cloudflare/bin/github-actions-bridge

      - name: Upload phase metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-executor-phase-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/rundiff/go-executor/*.metrics.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bridge diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-executor-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            log/test.log
            tmp/rundiff
          if-no-files-found: ignore
          retention-days: 7


  external_node_proof:
    if: github.event.pull_request.head.ref == 'feat/vs17-external-node-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rundiff_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rundiff_bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUNDIFF_CONTROL_PLANE_URL: https://rundiff.com
      RUNDIFF_EXECUTOR_TOKEN: ${{ secrets.RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN }}
      RUNDIFF_GO_EXECUTOR_BIN: /tmp/rundiff-executor
      RUNDIFF_DEPENDENCY_CACHE_ROOT: ${{ runner.temp }}/rundiff-dependency-cache
      RUNDIFF_DEPENDENCY_CACHE_NAMESPACE: external-node-product-proof

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Build Go executor
        working-directory: apps/executor-go
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/rundiff-executor ./cmd/rundiff-executor

      - name: Resolve external execution
        id: resolve_external
        run: |
          set -euo pipefail
          test -n "$RUNDIFF_EXECUTOR_TOKEN" || {
            echo "::error::RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN is not configured"
            exit 1
          }

          proof=docs/proofs/external-node-proof.json
          repository="$(jq -r .repository "$proof")"
          pr_number="$(jq -r .pull_request_number "$proof")"
          baseline_sha="$(jq -r .baseline_sha "$proof")"
          candidate_sha="$(jq -r .candidate_sha "$proof")"

          request="$(jq -nc \
            --arg repository "$repository" \
            --argjson pull_request_number "$pr_number" \
            --arg baseline_sha "$baseline_sha" \
            --arg candidate_sha "$candidate_sha" \
            '{repository:$repository,pull_request_number:$pull_request_number,baseline_sha:$baseline_sha,candidate_sha:$candidate_sha}')"

          for attempt in $(seq 1 40); do
            status="$(curl -sS -o /tmp/resolve.json -w '%{http_code}' \
              -H "Authorization: Bearer $RUNDIFF_EXECUTOR_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$request" \
              "$RUNDIFF_CONTROL_PLANE_URL/api/execution-bridges/github-actions/resolve")"

            if [[ "$status" == "200" ]]; then
              echo "execution_id=$(jq -r .execution_id /tmp/resolve.json)" >> "$GITHUB_OUTPUT"
              echo "attempt_number=$(jq -r .attempt_number /tmp/resolve.json)" >> "$GITHUB_OUTPUT"
              cat /tmp/resolve.json
              exit 0
            fi

            if [[ "$status" != "409" ]]; then
              cat /tmp/resolve.json
              echo "::error::resolve returned HTTP $status"
              exit 1
            fi

            sleep 3
          done

          cat /tmp/resolve.json
          echo "::error::external execution did not become available"
          exit 1

      - name: Execute external Node request
        run: |
          mkdir -p tmp/rundiff
          /tmp/rundiff-executor agent \
            --control-plane-url "$RUNDIFF_CONTROL_PLANE_URL" \
            --execution-id "${{ steps.resolve_external.outputs.execution_id }}" \
            --attempt "${{ steps.resolve_external.outputs.attempt_number }}" \
            --cwd "$GITHUB_WORKSPACE" \
            --result tmp/rundiff/external-node-result.json

      - name: Show external result
        if: always()
        run: |
          if [[ -f tmp/rundiff/external-node-result.json ]]; then
            jq . tmp/rundiff/external-node-result.json
          fi

      - name: Upload external proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-external-node-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/rundiff/external-node-result.json
            tmp/rundiff/go-executor/*.jsonl
          if-no-files-found: warn
          retention-days: 14
