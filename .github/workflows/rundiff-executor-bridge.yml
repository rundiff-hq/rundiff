name: RunDiff Executor Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      execution_id:
        description: Exact RunDiff execution ID
        required: true
        type: string
      attempt_number:
        description: Exact RunDiff attempt number
        required: true
        type: string
      repository:
        description: Customer repository identity
        required: true
        type: string
      candidate_sha:
        description: Candidate SHA for audit output
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('rundiff-execution-{0}', inputs.execution_id) || format('rundiff-executor-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rundiff_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rundiff_bridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_bridge
      SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_bridge_queue
      RUNDIFF_LOCAL_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432
      RUNDIFF_CONTROL_PLANE_URL: https://rundiff.com
      RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN: ${{ secrets.RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN }}
      RUNDIFF_EXECUTOR_TOKEN: ${{ secrets.RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN }}
      RUNDIFF_EXECUTOR_SUPERVISOR: go
      RUNDIFF_GO_EXECUTOR_BIN: /tmp/rundiff-executor
      RUNDIFF_DEPENDENCY_CACHE_ROOT: ${{ github.workspace }}/tmp/rundiff-dependency-cache
      RUNDIFF_DEPENDENCY_CACHE_NAMESPACE: ${{ inputs.repository || github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Restore RunDiff dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rundiff-dependency-cache
          key: rundiff-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            rundiff-deps-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Go executor supervisor
        working-directory: apps/executor-go
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/rundiff-executor ./cmd/rundiff-executor

      - name: Verify bridge secret
        run: |
          if [[ -z "$RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN" ]]; then
            echo "::error::RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN is not configured"
            exit 1
          fi

      - name: Validate dispatched identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.execution_id }}" =~ ^[0-9a-f-]{36}$ ]]
          [[ "${{ inputs.attempt_number }}" =~ ^[1-9][0-9]*$ ]]
          [[ "${{ inputs.repository }}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${{ inputs.candidate_sha }}" =~ ^[a-f0-9]{40}$ ]]
          echo "dispatch_execution=${{ inputs.execution_id }}"
          echo "dispatch_attempt=${{ inputs.attempt_number }}"
          echo "dispatch_repository=${{ inputs.repository }}"
          echo "dispatch_candidate=${{ inputs.candidate_sha }}"

      - name: Prepare RunDiff database
        if: github.event_name == 'pull_request'
        run: bin/rails db:prepare

      - name: Claim and execute RunDiff request
        if: github.event_name == 'pull_request'
        run: apps/control-plane-cloudflare/bin/github-actions-bridge

      - name: Execute exact dispatched request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/rundiff/go-executor
          /tmp/rundiff-executor agent             --control-plane-url "$RUNDIFF_CONTROL_PLANE_URL"             --token-env RUNDIFF_EXECUTOR_TOKEN             --execution-id "${{ inputs.execution_id }}"             --attempt "${{ inputs.attempt_number }}"             --unclaimable-ok             --result tmp/rundiff/dispatched-result.json             --cwd "$GITHUB_WORKSPACE"

      - name: Upload phase metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-executor-phase-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/rundiff/go-executor/*.metrics.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bridge diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-executor-bridge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            log/test.log
            tmp/rundiff
          if-no-files-found: ignore
          retention-days: 7
