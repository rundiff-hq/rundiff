name: Ruby vs Go Supervisor Benchmark

on:
  pull_request:
    paths:
      - "apps/executor-go/**"
      - "script/run_cloudflare_executor_bridge.rb"
      - ".github/workflows/supervisor-benchmark.yml"
      - "docs/implementation-plans/0017-supervisor-benchmark-v1.md"
  workflow_dispatch:
    inputs:
      pairs:
        description: Paired startup repetitions
        required: true
        default: "10"
      concurrency:
        description: Idle concurrency cohorts
        required: true
        default: "1,5,10"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      RAILS_ENV: test
      RUNDIFF_GO_EXECUTOR_BIN: /tmp/rundiff-executor

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Build Go executor
        working-directory: apps/executor-go
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/rundiff-executor ./cmd/rundiff-executor

      - name: Prepare delegated cgroup v2 benchmark subtree
        run: |
          set -euo pipefail
          test -f /sys/fs/cgroup/cgroup.controllers

          CURRENT_RELATIVE_CGROUP="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          CURRENT_CGROUP="/sys/fs/cgroup${CURRENT_RELATIVE_CGROUP}"
          test -d "$CURRENT_CGROUP"
          test -f "$CURRENT_CGROUP/cgroup.procs"

          CGROUP_ROOT="$CURRENT_CGROUP/rundiff-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ORIGINAL_PARENT_PROCS_OWNER="$(stat -c '%u:%g' "$CURRENT_CGROUP/cgroup.procs")"

          sudo mkdir "$CGROUP_ROOT"
          sudo chown "$USER:$(id -gn)" "$CURRENT_CGROUP/cgroup.procs"
          sudo chown "$USER:$(id -gn)" "$CGROUP_ROOT" "$CGROUP_ROOT/cgroup.procs"
          test -f "$CGROUP_ROOT/cpu.stat"

          # cgroupfs creates child control files as root-owned on the hosted runner.
          # Pre-create/delegate children before the benchmark so the measured child
          # can join its cgroup before exec without sudo or helper-process overhead.
          for i in $(seq 1 256); do
            child="$CGROUP_ROOT/$(printf 'sample-%04d' "$i")"
            sudo mkdir "$child"
            sudo chown "$USER:$(id -gn)" "$child" "$child/cgroup.procs"
            test -f "$child/cpu.stat"
          done

          # Prove that an unprivileged child can really migrate before we trust
          # cpu.stat as benchmark evidence.
          (
            echo "$BASHPID" > "$CGROUP_ROOT/sample-0256/cgroup.procs"
            test "$(cat /proc/$BASHPID/cgroup | awk -F: '$1 == "0" { print $3 }')" != "$CURRENT_RELATIVE_CGROUP"
          )

          echo "RUNDIFF_BENCHMARK_CGROUP_ROOT=$CGROUP_ROOT" >> "$GITHUB_ENV"
          echo "RUNDIFF_BENCHMARK_CGROUP_PARENT=$CURRENT_CGROUP" >> "$GITHUB_ENV"
          echo "RUNDIFF_BENCHMARK_PARENT_PROCS_OWNER=$ORIGINAL_PARENT_PROCS_OWNER" >> "$GITHUB_ENV"

      - name: Run paired supervisor benchmark
        env:
          PAIRS: ${{ github.event_name == 'workflow_dispatch' && inputs.pairs || '10' }}
          CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '1,5,10' }}
        run: |
          python3 apps/executor-go/bin/supervisor-benchmark.py \
            --pairs "$PAIRS" \
            --concurrency "$CONCURRENCY"

      - name: Cleanup cgroup v2 benchmark subtree
        if: always()
        run: |
          if [[ -n "${RUNDIFF_BENCHMARK_CGROUP_ROOT:-}" && -d "$RUNDIFF_BENCHMARK_CGROUP_ROOT" ]]; then
            sudo find "$RUNDIFF_BENCHMARK_CGROUP_ROOT" -mindepth 1 -maxdepth 1 -type d -exec rmdir {} + 2>/dev/null || true
            sudo rmdir "$RUNDIFF_BENCHMARK_CGROUP_ROOT" || true
          fi
          if [[ -n "${RUNDIFF_BENCHMARK_CGROUP_PARENT:-}" && -n "${RUNDIFF_BENCHMARK_PARENT_PROCS_OWNER:-}" ]]; then
            sudo chown "$RUNDIFF_BENCHMARK_PARENT_PROCS_OWNER" "$RUNDIFF_BENCHMARK_CGROUP_PARENT/cgroup.procs" || true
          fi

      - name: Publish summary
        if: always()
        run: |
          if [[ -f tmp/rundiff/supervisor-benchmark/summary.md ]]; then
            cat tmp/rundiff/supervisor-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rundiff-supervisor-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/rundiff/supervisor-benchmark
          if-no-files-found: error
          retention-days: 14
