name: Production Lab

on:
  pull_request:
    paths:
      - "app/**"
      - "bin/**"
      - "config/**"
      - "db/**"
      - "lab/**"
      - "lib/**"
      - "script/**"
      - "Dockerfile"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/production-lab.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bin/**"
      - "config/**"
      - "db/**"
      - "lab/**"
      - "lib/**"
      - "script/**"
      - "Dockerfile"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/production-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production_lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Run production topology lab
        run: bin/lab run production --case topology

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/lab/production/topology
          if-no-files-found: warn
          retention-days: 7
