name: Isolated Compose Provider Proof

on:
  pull_request:
    paths:
      - "app/**"
      - "apps/executor-go/**"
      - "apps/executor-go/**"
      - "bin/lab"
      - "config/**"
      - "db/**"
      - "lab/executor/isolated-compose-provider.sh"
      - "lib/**"
      - "script/prove_isolated_compose_provider.rb"
      - "script/prove_subject_privilege_boundary.rb"
      - "Dockerfile"
      - "Dockerfile.compose-provider"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/isolated-compose-provider-proof.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bin/lab"
      - "config/**"
      - "db/**"
      - "lab/executor/isolated-compose-provider.sh"
      - "lib/**"
      - "script/prove_isolated_compose_provider.rb"
      - "script/prove_subject_privilege_boundary.rb"
      - "Dockerfile"
      - "Dockerfile.compose-provider"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/isolated-compose-provider-proof.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated_compose_provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Run isolated Compose provider lab
        run: bin/lab run executor --case isolated-compose-provider

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-isolated-compose-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/lab/executor/isolated-compose-provider
          if-no-files-found: warn
          retention-days: 7
