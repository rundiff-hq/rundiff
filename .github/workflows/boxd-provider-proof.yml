name: Boxd Provider Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boxd-provider-proof
  cancel-in-progress: false

jobs:
  fork-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/executor-go
    env:
      BOXD_API_KEY: ${{ secrets.BOXD_API_KEY }}
      RUNDIFF_BOXD_LIVE: "1"
      RUNDIFF_BOXD_PROOF_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      RUNDIFF_BOXD_TOOL_SHA: "${{ github.sha }}"
      RUNDIFF_BOXD_BEHAVIORAL_DB_BENCHMARK_REPORT: ${{ github.workspace }}/tmp/rundiff/boxd-prerunning-postgres-benchmark.json

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache-dependency-path: apps/executor-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require Boxd API key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BOXD_API_KEY}" ]]; then
            echo "Repository secret BOXD_API_KEY is required." >&2
            exit 1
          fi

      - name: Install pinned Boxd SDK bridge
        working-directory: apps/executor-go/internal/compute/boxd/sdkbridge
        run: npm install --no-audit --no-fund

      - name: Verify Boxd SDK bridge
        working-directory: apps/executor-go/internal/compute/boxd/sdkbridge
        run: |
          node --check operations.mjs
          node --check bridge.mjs
          node --check session.mjs
          node -e 'import("@boxd-sh/sdk").then(({ VERSION }) => console.log("boxd_sdk_version=" + VERSION))'

      - name: Prove create, fork and copy-on-write isolation
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveForkIsolation$' -count=1

      - name: Prove persistent golden reuse
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLivePersistentGoldenReuse$' -count=1

      - name: Prove long-lived SDK session reuse
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLivePersistentGoldenReuseSession$' -count=1

      - name: Prove parallel pair fork isolation
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveParallelForkIsolation$' -count=1

      - name: Benchmark sequential versus parallel pair fork
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveParallelForkBenchmark$' -count=1

      - name: Prove running PostgreSQL fork isolation
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveRunningPostgresForkIsolation$' -count=1

      - name: Benchmark inherited PostgreSQL Behavioral Diff
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveBehavioralDiffInheritedPostgresBenchmark$' -count=1

      - name: Upload inherited PostgreSQL benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxd-prerunning-postgres-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/rundiff/boxd-prerunning-postgres-benchmark.json
          if-no-files-found: error
          retention-days: 14

      - name: Prove real Behavioral Diff on forked subjects
        shell: bash
        run: |
          set -euo pipefail
          go test -v ./internal/compute/boxd -run '^TestLiveBehavioralDiff$' -count=1
