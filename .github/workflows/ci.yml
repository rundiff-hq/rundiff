name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Demo portable behavioral diff
        run: |
          bin/rundiff diff \
            --baseline examples/behavioral-diff/main.json \
            --candidate examples/behavioral-diff/candidate.json \
            --format json > /tmp/rundiff-result.json
          cat /tmp/rundiff-result.json

      - name: Brakeman
        run: |
          set -Eeuo pipefail
          if ! bundle exec brakeman --no-pager --format json --output /tmp/brakeman.json; then
            cat /tmp/brakeman.json
            exit 1
          fi

      - name: RuboCop
        run: bundle exec rubocop

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rundiff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rundiff_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_test
      SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_queue_test
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Test
        run: bin/rails test

      - name: Dogfood durable worker evidence
        run: bundle exec ruby script/rundiff_durable_worker_evidence.rb

      - name: Dogfood isolated worker process
        run: bundle exec ruby script/rundiff_os_process_worker_proof.rb

      - name: Dogfood Solid Queue transport
        env:
          RUNDIFF_SOLID_QUEUE: "1"
          SOLID_QUEUE_SKIP_RECURRING: "true"
        run: bundle exec ruby script/rundiff_solid_queue_transport_proof.rb

      - name: Dogfood Rails instrumentation
        env:
          RUNDIFF_OUTPUT: tmp/rundiff-dogfood.json
        run: bin/rails rundiff:dogfood

      - name: Prove Rails SQLite customer subject
        run: ruby script/prove_rails_sqlite_subject.rb

      - name: Prepare real Git subjects
        id: git_subjects
        if: github.event_name == 'pull_request'
        run: |
          set -Eeuo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base_sha...$head_sha" > /tmp/rundiff-changed-paths.txt

          if git cat-file -e "$base_sha:lib/rundiff/rails/execution_quiescence.rb" 2>/dev/null &&
             git cat-file -e "$head_sha:lib/rundiff/rails/execution_quiescence.rb" 2>/dev/null; then
            echo "ab_supported=true" >> "$GITHUB_OUTPUT"
            git worktree add --detach /tmp/rundiff-base "$base_sha"
            git worktree add --detach /tmp/rundiff-candidate "$head_sha"
          else
            echo "ab_supported=false" >> "$GITHUB_OUTPUT"
            echo "Skipping exact A/B dogfood because one side predates the canonical RunDiff runtime."
          fi

      - name: Prepare isolated subject databases
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true'
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        run: |
          (
            cd /tmp/rundiff-base
            DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_base \
            SOLID_QUEUE_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_base_queue \
              bundle exec rails db:prepare
          )
          (
            cd /tmp/rundiff-candidate
            DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_candidate \
            SOLID_QUEUE_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_candidate_queue \
              bundle exec rails db:prepare
          )

      - name: Capture baseline subject
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true'
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
          RUNDIFF_SOLID_QUEUE: "1"
          RUNDIFF_ASYNC_TRANSPORT: solid_queue
          SOLID_QUEUE_SKIP_RECURRING: "true"
          SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_base_queue
          RUNDIFF_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          RUNDIFF_SCENARIO_ID: dogfood.git.behavior
          RUNDIFF_SUBJECT: git-comparison
          RUNDIFF_EXECUTION_LABEL: ${{ github.base_ref }}
          RUNDIFF_EXECUTION_SHA: ${{ github.event.pull_request.base.sha }}
          RUNDIFF_OUTPUT: /tmp/rundiff-base.json
        run: |
          cd /tmp/rundiff-base
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_base \
            bundle exec ruby "${GITHUB_WORKSPACE}/script/rundiff_capture_subject.rb"

      - name: Capture candidate subject
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true'
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
          RUNDIFF_SOLID_QUEUE: "1"
          RUNDIFF_ASYNC_TRANSPORT: solid_queue
          SOLID_QUEUE_SKIP_RECURRING: "true"
          SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_candidate_queue
          RUNDIFF_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          RUNDIFF_SCENARIO_ID: dogfood.git.behavior
          RUNDIFF_SUBJECT: git-comparison
          RUNDIFF_EXECUTION_LABEL: ${{ github.head_ref }}
          RUNDIFF_EXECUTION_SHA: ${{ github.event.pull_request.head.sha }}
          RUNDIFF_OUTPUT: /tmp/rundiff-candidate.json
        run: |
          cd /tmp/rundiff-candidate
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/rundiff_candidate \
            bundle exec ruby "${GITHUB_WORKSPACE}/script/rundiff_capture_subject.rb"

      - name: Compare real Git subjects
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true'
        env:
          RUNDIFF_BASELINE_INPUT: /tmp/rundiff-base.json
          RUNDIFF_CANDIDATE_INPUT: /tmp/rundiff-candidate.json
          RUNDIFF_CHANGED_PATHS: /tmp/rundiff-changed-paths.txt
          RUNDIFF_OUTPUT: tmp/rundiff-git-comparison.json
        run: bin/rails rundiff:compare_executions

      - name: Publish RunDiff GitHub check
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNDIFF_INPUT: tmp/rundiff-git-comparison.json
          RUNDIFF_PUBLISH: "1"
          RUNDIFF_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RUNDIFF_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bin/rails rundiff:github_check

      - name: Publish RunDiff GitHub feedback
        if: github.event_name == 'pull_request' && steps.git_subjects.outputs.ab_supported == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNDIFF_INPUT: tmp/rundiff-git-comparison.json
          RUNDIFF_PUBLISH: "1"
          RUNDIFF_COMMENT_AUTHOR: github-actions[bot]
          RUNDIFF_BASELINE_LABEL: ${{ github.base_ref }}
          RUNDIFF_BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNDIFF_CANDIDATE_LABEL: ${{ github.head_ref }}
          RUNDIFF_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RUNDIFF_EXECUTION_MODE: exact Git worktrees + isolated PostgreSQL + Solid Queue databases
          RUNDIFF_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bin/rails rundiff:github_comment

  remote_executor_topology:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rundiff_executor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rundiff_executor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUNDIFF_IMAGE: rundiff-ci:${{ github.sha }}
      EXECUTOR_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rundiff_executor_ci
      RUNDIFF_EXECUTOR_SERVICE_TOKEN: ci-executor-service-token
      RUNDIFF_PROOF_EXECUTION_ID: github-topology-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build deployable image
        run: docker build -t "$RUNDIFF_IMAGE" .

      - name: Prepare trusted subject bundle seed
        run: |
          docker volume create rundiff-topology-bundle-seed >/dev/null
          docker run --rm \
            -v rundiff-topology-bundle-seed:/rundiff-bundle-seed \
            -e RUNDIFF_BUNDLE_SEED_ROOT=/rundiff-bundle-seed \
            "$RUNDIFF_IMAGE" ruby script/prepare_trusted_bundle_seed.rb
          docker run --rm \
            -v rundiff-topology-bundle-seed:/rundiff-bundle-seed:ro \
            "$RUNDIFF_IMAGE" sh -lc \
            'test -d /rundiff-bundle-seed && ! touch /rundiff-bundle-seed/.write-test'

      - name: Prepare executor database
        run: |
          docker run --rm --network host \
            -e SECRET_KEY_BASE_DUMMY=1 \
            -e RAILS_ENV=production \
            -e DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e SOLID_QUEUE_DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e RUNDIFF_RUNTIME_ROLE=executor_service \
            -e RUNDIFF_EXECUTOR_SERVICE_TOKEN="$RUNDIFF_EXECUTOR_SERVICE_TOKEN" \
            -e RUNDIFF_EXECUTOR_SERVICE_ADAPTER=git_clone \
            "$RUNDIFF_IMAGE" bin/rails db:prepare

      - name: Start production executor service
        run: |
          docker run -d --name rundiff-executor --network host \
            -v rundiff-topology-bundle-seed:/rundiff-bundle-seed:ro \
            -e SECRET_KEY_BASE_DUMMY=1 \
            -e RAILS_ENV=production \
            -e DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e SOLID_QUEUE_DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e RUNDIFF_RUNTIME_ROLE=executor_service \
            -e RUNDIFF_EXECUTOR_SERVICE_TOKEN="$RUNDIFF_EXECUTOR_SERVICE_TOKEN" \
            -e RUNDIFF_EXECUTOR_SERVICE_ADAPTER=git_clone \
            -e RUNDIFF_LOCAL_POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432 \
            -e RUNDIFF_SUBJECT_BUNDLE_SEED_ROOT=/rundiff-bundle-seed \
            "$RUNDIFF_IMAGE" bin/rails server -b 0.0.0.0 -p 4010

      - name: Verify executor readiness and secret isolation
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4010/ready > /tmp/rundiff-executor-ready.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs rundiff-executor
              exit 1
            fi
            sleep 1
          done
          cat /tmp/rundiff-executor-ready.json
          docker exec rundiff-executor sh -lc '
            test -z "${RUNDIFF_GITHUB_PRIVATE_KEY_PATH:-}" &&
            test -z "${RUNDIFF_GITHUB_WEBHOOK_SECRET:-}" &&
            test -z "${RUNDIFF_GITHUB_APP_ID:-}" &&
            test -z "${RUNDIFF_REMOTE_EXECUTOR_URL:-}" &&
            test -z "${RUNDIFF_REMOTE_EXECUTOR_TOKEN:-}"
          '

      - name: Dispatch Request v1 from separate control-plane client
        env:
          RUNDIFF_PROOF_REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --network host \
            -e SECRET_KEY_BASE_DUMMY=1 \
            -e RAILS_ENV=production \
            -e DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e RUNDIFF_REMOTE_EXECUTOR_URL=http://127.0.0.1:4010/v1/executions \
            -e RUNDIFF_REMOTE_EXECUTOR_TOKEN="$RUNDIFF_EXECUTOR_SERVICE_TOKEN" \
            -e RUNDIFF_PROOF_REPOSITORY_TOKEN="$RUNDIFF_PROOF_REPOSITORY_TOKEN" \
            -e RUNDIFF_PROOF_EXECUTION_ID="$RUNDIFF_PROOF_EXECUTION_ID" \
            -e RUNDIFF_PROOF_REPOSITORY="${{ github.repository }}" \
            -e RUNDIFF_PROOF_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e RUNDIFF_PROOF_BASELINE_REF="${{ github.base_ref }}" \
            -e RUNDIFF_PROOF_CANDIDATE_REF="${{ github.head_ref }}" \
            -e RUNDIFF_PROOF_BASELINE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e RUNDIFF_PROOF_CANDIDATE_SHA="${{ github.event.pull_request.head.sha }}" \
            "$RUNDIFF_IMAGE" ruby script/prove_remote_executor_topology.rb

      - name: Verify repository capability was not persisted
        env:
          EXPECTED_REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --network host \
            -e SECRET_KEY_BASE_DUMMY=1 \
            -e RAILS_ENV=production \
            -e DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e SOLID_QUEUE_DATABASE_URL="$EXECUTOR_DATABASE_URL" \
            -e RUNDIFF_RUNTIME_ROLE=executor_service \
            -e RUNDIFF_EXECUTOR_SERVICE_TOKEN="$RUNDIFF_EXECUTOR_SERVICE_TOKEN" \
            -e RUNDIFF_EXECUTOR_SERVICE_ADAPTER=git_clone \
            -e RUNDIFF_PROOF_EXECUTION_ID="$RUNDIFF_PROOF_EXECUTION_ID" \
            -e EXPECTED_REPOSITORY_TOKEN="$EXPECTED_REPOSITORY_TOKEN" \
            "$RUNDIFF_IMAGE" bin/rails runner '
              record = RunDiffExecutorRequest.find_by!(idempotency_key: "#{ENV.fetch("RUNDIFF_PROOF_EXECUTION_ID")}:1")
              raise "Executor request did not complete" unless record.status == "completed"
              serialized = record.attributes.to_json
              raise "Repository capability leaked into executor ledger" if serialized.include?(ENV.fetch("EXPECTED_REPOSITORY_TOKEN"))
              puts "executor_ledger_status=completed"
              puts "repository_capability_persisted=false"
            '

      - name: Executor logs
        if: always()
        run: docker logs rundiff-executor || true

      - name: Stop executor service
        if: always()
        run: |
          docker rm -f rundiff-executor || true
          docker volume rm -f rundiff-topology-bundle-seed || true
