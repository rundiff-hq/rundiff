name: External Node Product Proof

on:
  push:
    branches:
      - feat/vs17-external-node-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-node-product-proof
  cancel-in-progress: true

jobs:
  external_node:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor-go/go.mod
          cache: false

      - name: Build Go executor
        working-directory: apps/executor-go
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/rundiff-executor ./cmd/rundiff-executor

      - name: Run external Node proof
        env:
          RUNDIFF_CONTROL_PLANE_URL: https://rundiff.com
          RUNDIFF_EXECUTOR_TOKEN: ${{ secrets.RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN }}
          RUNDIFF_DEPENDENCY_CACHE_NAMESPACE: external-node-product-proof
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --rm \
            --name rundiff-proof-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rundiff_bridge \
            -p 5432:5432 \
            postgres:17
          trap 'docker rm -f rundiff-proof-postgres >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec rundiff-proof-postgres pg_isready -U postgres -d rundiff_bridge >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec rundiff-proof-postgres pg_isready -U postgres -d rundiff_bridge

          if [[ -z "$RUNDIFF_EXECUTOR_TOKEN" ]]; then
            echo "::error::RUNDIFF_GITHUB_ACTIONS_BRIDGE_TOKEN is not configured"
            exit 1
          fi

          proof="docs/proofs/external-node-proof.json"
          execution_id=""
          attempt_number=""

          for attempt in $(seq 1 10); do
            status="$(curl -sS -o /tmp/resolve.json -w '%{http_code}' \
              -H "Authorization: Bearer $RUNDIFF_EXECUTOR_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$proof" \
              "$RUNDIFF_CONTROL_PLANE_URL/api/execution-bridges/github-actions/resolve")"

            if [[ "$status" == "200" ]]; then
              execution_id="$(jq -r .execution_id /tmp/resolve.json)"
              attempt_number="$(jq -r .attempt_number /tmp/resolve.json)"
              break
            fi

            if [[ "$status" != "409" ]]; then
              cat /tmp/resolve.json
              echo "::error::resolve returned HTTP $status"
              exit 1
            fi

            echo "waiting for external execution: $attempt/10"
            sleep 2
          done

          if [[ -z "$execution_id" || -z "$attempt_number" ]]; then
            cat /tmp/resolve.json
            echo "::error::external execution did not become available"
            exit 1
          fi

          mkdir -p tmp/rundiff
          /tmp/rundiff-executor agent \
            --control-plane-url "$RUNDIFF_CONTROL_PLANE_URL" \
            --execution-id "$execution_id" \
            --attempt "$attempt_number" \
            --cwd "$GITHUB_WORKSPACE" \
            --result tmp/rundiff/external-node-result.json

          jq . tmp/rundiff/external-node-result.json
