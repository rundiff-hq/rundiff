name: External Node Product Proof

on:
  push:
    branches:
      - feat/vs17-external-node-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate target
        run: jq . docs/proofs/external-node-proof.json
