name: Compose Service Proof

on:
  pull_request:
    paths:
      - "lib/**"
      - "script/prove_compose_service_provider.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/compose-service-proof.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "script/prove_compose_service_provider.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/compose-service-proof.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose_service_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Verify Docker Compose is host capability
        run: |
          docker compose version
          test -S /var/run/docker.sock

      - name: Prove explicit Compose service lifecycle
        run: ruby script/prove_compose_service_provider.rb
