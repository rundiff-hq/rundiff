name: Compose Service Proof

on:
  pull_request:
    paths:
      - "bin/lab"
      - "lab/executor/compose-service.sh"
      - "lib/**"
      - "script/prove_compose_service_provider.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/compose-service-proof.yml"
  push:
    branches: [main]
    paths:
      - "bin/lab"
      - "lab/executor/compose-service.sh"
      - "lib/**"
      - "script/prove_compose_service_provider.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/compose-service-proof.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose_service_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Run Compose service lab
        run: bin/lab run executor --case compose-service

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-compose-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/lab/executor/compose-service
          if-no-files-found: warn
          retention-days: 7
