services:
  postgres:
    image: ${RUNDIFF_POSTGRES_IMAGE:?set RUNDIFF_POSTGRES_IMAGE to an immutable PostgreSQL image reference}
    restart: unless-stopped
    env_file:
      - .env.executor.postgres
    volumes:
      - executor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/rundiff-hq/rundiff:${RUNDIFF_IMAGE_TAG:?set RUNDIFF_IMAGE_TAG to an immutable release or sha tag}
    env_file:
      - .env.executor
    command: bin/rails db:prepare
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  rundiff:
    image: ghcr.io/rundiff-hq/rundiff:${RUNDIFF_IMAGE_TAG:?set RUNDIFF_IMAGE_TAG to an immutable release or sha tag}
    restart: unless-stopped
    env_file:
      - .env.executor
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  tunnel:
    image: ${RUNDIFF_CLOUDFLARED_IMAGE:?set RUNDIFF_CLOUDFLARED_IMAGE to an immutable cloudflared image reference}
    restart: unless-stopped
    env_file:
      - .env.executor.tunnel
    command: tunnel --no-autoupdate run
    depends_on:
      - rundiff

volumes:
  executor-postgres:
