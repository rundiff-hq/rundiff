name: rundiff-production-lab

x-rundiff-image: &rundiff-image
  image: rundiff-production-lab:local
  build:
    context: ../..
    dockerfile: Dockerfile

x-github-image: &github-image
  image: rundiff-production-lab-github:local
  build:
    context: ../..
    dockerfile: lab/production/github/Dockerfile

x-control-plane-environment: &control-plane-environment
  RAILS_ENV: production
  SECRET_KEY_BASE: production-lab-control-plane-secret-key-base
  RUNDIFF_RUNTIME_ROLE: control_plane
  DATABASE_URL: postgres://postgres:postgres@control-plane-postgres:5432/rundiff_control_plane
  SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@control-plane-postgres:5432/rundiff_control_plane_queue
  RUNDIFF_PUBLIC_URL: https://control-plane-tls:4444
  GITHUB_API_URL: https://github-edge:4002
  RUNDIFF_GITHUB_APP_SLUG: rundiff-lab
  RUNDIFF_GITHUB_APP_ID: "12345"
  RUNDIFF_GITHUB_WEBHOOK_SECRET: rundiff-production-lab-webhook-secret
  RUNDIFF_GITHUB_PRIVATE_KEY_PATH: /lab-state/github-app.pem
  RUNDIFF_GITHUB_APP_CHECK_NAME: RunDiff Lab / Behavioral Diff
  RUNDIFF_GITHUB_APP_BOT_LOGIN: rundiff-lab[bot]
  RUNDIFF_GITHUB_REPOSITORY_ALLOWLIST: admin/customer-rails
  RUNDIFF_EXECUTOR: remote
  RUNDIFF_REMOTE_EXECUTOR_URL: https://executor-tls:4443/v1/executions
  RUNDIFF_REMOTE_EXECUTOR_TOKEN: production-lab-executor-token
  RUNDIFF_REMOTE_EXECUTOR_OPEN_TIMEOUT_SECONDS: "5"
  RUNDIFF_REMOTE_EXECUTOR_READ_TIMEOUT_SECONDS: "300"
  RUNDIFF_EXECUTION_LEASE_SECONDS: "240"
  RUNDIFF_EXECUTION_HEARTBEAT_INTERVAL_SECONDS: "60"
  SOLID_QUEUE_SKIP_RECURRING: "true"
  SSL_CERT_FILE: /lab-tls/ca.pem

x-executor-environment: &executor-environment
  RAILS_ENV: production
  SECRET_KEY_BASE: production-lab-executor-secret-key-base
  RUNDIFF_RUNTIME_ROLE: executor_service
  DATABASE_URL: postgres://postgres:postgres@executor-postgres:5432/rundiff_executor
  SOLID_QUEUE_DATABASE_URL: postgres://postgres:postgres@executor-postgres:5432/rundiff_executor
  RUNDIFF_EXECUTOR_SERVICE_TOKEN: production-lab-executor-token
  RUNDIFF_EXECUTOR_SERVICE_ADAPTER: git_clone
  RUNDIFF_EXECUTOR_SERVICE_REQUEST_LEASE_SECONDS: "360"
  RUNDIFF_GITHUB_GIT_BASE_URL: http://git-origin
  RUNDIFF_SUBJECT_BUNDLE_SEED_ROOT: /lab-bundle-seed
  SSL_CERT_FILE: /lab-tls/ca.pem

services:
  prepare:
    <<: *rundiff-image
    command: ruby script/prepare_production_lab.rb
    environment:
      RUNDIFF_LAB_GIT_ROOT: /lab-git
      RUNDIFF_LAB_STATE_ROOT: /lab-state
      RUNDIFF_LAB_TLS_ROOT: /lab-tls
      RUNDIFF_LAB_BUNDLE_SEED_ROOT: /lab-bundle-seed
    volumes:
      - lab-git:/lab-git
      - lab-state:/lab-state
      - lab-tls:/lab-tls
      - lab-bundle-seed:/lab-bundle-seed

  git-origin:
    image: nginx:1.29-alpine
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - lab-git:/usr/share/nginx/html:ro

  github-emulator:
    <<: *github-image
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      LAB_GITHUB_WEBHOOK_SECRET: rundiff-production-lab-webhook-secret
      LAB_GITHUB_APP_ID: "12345"
      LAB_GITHUB_INSTALLATION_ID: "100"
      RUNDIFF_LAB_STATE_ROOT: /lab-state
      NODE_EXTRA_CA_CERTS: /lab-tls/ca.pem
    volumes:
      - lab-state:/lab-state
      - lab-tls:/lab-tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 60

  github-edge:
    <<: *github-image
    depends_on:
      prepare:
        condition: service_completed_successfully
      github-emulator:
        condition: service_healthy
    command: node edge.mjs
    environment:
      GITHUB_EMULATOR_URL: http://github-emulator:4001
      RUNDIFF_CONTROL_PLANE_WEBHOOK_URL: https://control-plane-tls:4444/github/webhooks
      LAB_GITHUB_WEBHOOK_SECRET: rundiff-production-lab-webhook-secret
      RUNDIFF_LAB_SHA_STATE: /lab-state/shas.json
      RUNDIFF_LAB_TLS_ROOT: /lab-tls
      NODE_EXTRA_CA_CERTS: /lab-tls/ca.pem
    volumes:
      - lab-state:/lab-state:ro
      - lab-tls:/lab-tls:ro

  control-plane-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rundiff_control_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rundiff_control_plane"]
      interval: 2s
      timeout: 2s
      retries: 60

  control-plane-db-prepare:
    <<: *rundiff-image
    depends_on:
      control-plane-postgres:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment: *control-plane-environment
    command: bin/rails db:prepare
    volumes:
      - lab-state:/lab-state:ro
      - lab-tls:/lab-tls:ro

  control-plane:
    <<: *rundiff-image
    depends_on:
      control-plane-db-prepare:
        condition: service_completed_successfully
      github-emulator:
        condition: service_healthy
    environment: *control-plane-environment
    command: bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - lab-state:/lab-state:ro
      - lab-tls:/lab-tls:ro

  control-plane-worker:
    <<: *rundiff-image
    depends_on:
      control-plane-db-prepare:
        condition: service_completed_successfully
      github-emulator:
        condition: service_healthy
    environment: *control-plane-environment
    command: ruby bin/jobs
    volumes:
      - lab-state:/lab-state:ro
      - lab-tls:/lab-tls:ro

  control-plane-tls:
    image: nginx:1.29-alpine
    depends_on:
      prepare:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    volumes:
      - ./control-plane.nginx.conf:/etc/nginx/nginx.conf:ro
      - lab-tls:/lab-tls:ro

  executor-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rundiff_executor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rundiff_executor"]
      interval: 2s
      timeout: 2s
      retries: 60

  executor-db-prepare:
    <<: *rundiff-image
    depends_on:
      executor-postgres:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment: *executor-environment
    command: bin/rails db:prepare
    volumes:
      - lab-tls:/lab-tls:ro

  executor:
    <<: *rundiff-image
    depends_on:
      executor-db-prepare:
        condition: service_completed_successfully
      git-origin:
        condition: service_started
    environment: *executor-environment
    command: bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - lab-tls:/lab-tls:ro
      - lab-bundle-seed:/lab-bundle-seed:ro

  executor-tls:
    image: nginx:1.29-alpine
    depends_on:
      prepare:
        condition: service_completed_successfully
      executor:
        condition: service_started
    volumes:
      - ./executor.nginx.conf:/etc/nginx/nginx.conf:ro
      - lab-tls:/lab-tls:ro

  driver:
    <<: *rundiff-image
    depends_on:
      github-emulator:
        condition: service_healthy
      github-edge:
        condition: service_started
      control-plane-tls:
        condition: service_started
      executor-tls:
        condition: service_started
      control-plane-worker:
        condition: service_started
    environment:
      GITHUB_EMULATOR_URL: http://github-emulator:4001
      RUNDIFF_LAB_CONTROL_PLANE_URL: https://control-plane-tls:4444
      RUNDIFF_LAB_EXECUTOR_URL: https://executor-tls:4443
      RUNDIFF_LAB_GITHUB_ADMIN_TOKEN: lab-admin-token
      RUNDIFF_GITHUB_APP_CHECK_NAME: RunDiff Lab / Behavioral Diff
      RUNDIFF_LAB_TIMEOUT_SECONDS: "300"
      SSL_CERT_FILE: /lab-tls/ca.pem
    command: ruby script/run_production_lab.rb
    volumes:
      - lab-tls:/lab-tls:ro

volumes:
  lab-git:
  lab-state:
  lab-tls:
  lab-bundle-seed:
